<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secrets Settings</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1e2430;
        --accent: #0b5fff;
        --muted: #5b6578;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        background: radial-gradient(circle at top right, #e6eefc, var(--bg));
        color: var(--text);
      }
      .wrap {
        max-width: 720px;
        margin: 2rem auto;
        padding: 1rem;
      }
      .panel {
        background: var(--panel);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(10, 26, 56, 0.08);
        padding: 1.2rem;
      }
      h1 { margin-top: 0; }
      .hint { color: var(--muted); }
      .msg { margin: 0.75rem 0; font-weight: 600; }
      .row {
        display: grid;
        gap: 0.5rem;
        margin: 1rem 0 1.2rem;
      }
      label { font-weight: 600; }
      input[type="password"] {
        border: 1px solid #cfd7e6;
        border-radius: 8px;
        padding: 0.6rem;
      }
      .actions { display: flex; gap: 0.6rem; }
      button {
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        padding: 0.55rem 0.85rem;
        cursor: pointer;
      }
      button.alt { background: #3b465d; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>Secret Keys</h1>
        <p class="hint">Add or update your connection keys. Values are never shown here after save.</p>
        {% if message %}<p class="msg">{{ message }}</p>{% endif %}

        {% for item in items %}
        <form method="post" class="row" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="key" value="{{ item.key }}" />
          <label>{{ item.label }}</label>
          <input type="password" name="value" value="" placeholder="Paste key" />
          <div class="actions">
            <button type="submit" name="action" value="save">Save</button>
            <button type="submit" class="alt" name="action" value="test">Test connection</button>
          </div>
        </form>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
