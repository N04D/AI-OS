name: PR Gate Plugin Boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  plugin-boundary:
    name: pr-gate/plugin-boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Collect changed plugin manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '(^|/)plugin\.ya?ml$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "manifest_args=--skip-no-manifests" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=""
          for f in "${files[@]}"; do
            args="$args --manifest $f"
          done
          echo "manifest_args=$args" >> "$GITHUB_OUTPUT"

      - name: Evaluate plugin boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plugin_manifest.py \
            ${{ steps.manifests.outputs.manifest_args }} \
            --schema governance/schema/plugins/plugin-manifest.v0.1.yaml \
            --policy governance/policy/plugins/plugin-boundary.v0.1.yaml \
            --output gate-plugin-boundary.json

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-plugin-boundary-pr-${{ github.event.pull_request.number }}
          path: gate-plugin-boundary.json
          if-no-files-found: error
