name: PR Gate Secrets Attack Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-attack-harness:
    name: pr-gate/secrets-attack-harness (${{ matrix.budget_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        budget_mode: [off, observe, enforce]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run secrets attack harness
        env:
          SECRETS_BUDGET_MODE: ${{ matrix.budget_mode }}
        run: |
          chmod +x ./scripts/security/attack_harness.sh
          ./scripts/security/attack_harness.sh

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-attack-harness-${{ matrix.budget_mode }}-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts/security_attack_harness/
          if-no-files-found: warn
