version: "3.9"

services:

  telegram-ingress:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webhook

    container_name: aios-telegram-ingress
    restart: unless-stopped

    environment:
      AIOS_TELEGRAM_WEBHOOK_SECRET: ${AIOS_TELEGRAM_WEBHOOK_SECRET}
      AIOS_TELEGRAM_ALLOWED_CHAT_IDS: ${AIOS_TELEGRAM_ALLOWED_CHAT_IDS}
      AIOS_TELEGRAM_BOT_TOKEN: ${AIOS_TELEGRAM_BOT_TOKEN}
      AIOS_TELEGRAM_WEBHOOK_URL: ${AIOS_TELEGRAM_WEBHOOK_URL}
      AIOS_VALIDATE_WEBHOOK_ON_STARTUP: "true"

    volumes:
      - ../state:/app/state
      - ../logs:/app/logs

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - aios-internal

    expose:
      - "8080"

  nginx:
    image: nginx:1.25-alpine
    container_name: aios-nginx
    restart: unless-stopped

    depends_on:
      - telegram-ingress

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/aios-telegram.conf:/etc/nginx/conf.d/aios-telegram.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - aios-internal

networks:
  aios-internal:
    driver: bridge
